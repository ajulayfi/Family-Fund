<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>دعم صندوق العائلة</title>
  <style>
    body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma; margin:0; background:#f6f7fb;}
    .wrap{max-width:520px; margin:24px auto; padding:16px;}
    .card{background:#fff; border-radius:16px; padding:16px; box-shadow:0 10px 30px rgba(0,0,0,.08);}
    label{display:block; margin-top:12px; font-size:13px; color:#333;}
    input,select{width:100%; padding:10px 12px; border:1px solid #ddd; border-radius:12px; font-size:15px;}
    button{width:100%; margin-top:16px; padding:12px; border:0; border-radius:12px; background:#111827; color:#fff; font-size:16px;}
    button:disabled{opacity:.6}
    .msg{margin-top:12px; padding:10px; border-radius:12px; display:none}
    .ok{background:#ecfdf5; border:1px solid #a7f3d0; color:#065f46}
    .err{background:#fef2f2; border:1px solid #fecaca; color:#991b1b}
    small{color:#666}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h2 style="margin:0 0 6px 0;">دعم صندوق العائلة</h2>
      <small>التحويل بنكي فقط. الرجاء رفع الإيصال.</small>

      <label>الاسم الكامل</label>
      <input id="fullName" placeholder="مثال: سارة بنت ناصر بن محمد ..." />

      <label>رقم الجوال</label>
      <input id="mobile" inputmode="numeric" placeholder="05xxxxxxxx" />

      <label>الفرع</label>
      <select id="branch">
        <option value="">اختر الفرع</option>
        <!-- عدلها لأسماء فروعك الحقيقية لاحقاً -->
        <option>Branch 1</option><option>Branch 2</option><option>Branch 3</option><option>Branch 4</option><option>Branch 5</option>
        <option>Branch 6</option><option>Branch 7</option><option>Branch 8</option><option>Branch 9</option><option>Branch 10</option>
        <option>Branch 11</option><option>Branch 12</option><option>Branch 13</option><option>Branch 14</option><option>Branch 15</option>
      </select>

      <label>المبلغ</label>
      <input id="amount" inputmode="decimal" placeholder="مثال: 500" />

      <label>تاريخ التحويل</label>
      <input id="transferDate" type="date" />

      <label>اسم البنك (اختياري)</label>
      <input id="bankName" placeholder="مثال: الراجحي" />

      <label>الإيصال (صورة/ PDF)</label>
      <input id="receipt" type="file" accept="image/*,application/pdf" />

      <button id="btn" onclick="submitDonation()">إرسال</button>

      <div id="ok" class="msg ok"></div>
      <div id="err" class="msg err"></div>
    </div>
  </div>

<script>
  const API_URL = "PUT_YOUR_APPS_SCRIPT_WEBAPP_URL_HERE";

  function show(id, text){
    const ok = document.getElementById("ok");
    const err = document.getElementById("err");
    ok.style.display = "none"; err.style.display = "none";
    const el = document.getElementById(id);
    el.textContent = text;
    el.style.display = "block";
  }

  function fileToBase64(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result); // dataURL
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function submitDonation(){
    const btn = document.getElementById("btn");
    btn.disabled = true;
    btn.textContent = "جاري الإرسال...";

    try{
      const fullName = document.getElementById("fullName").value.trim();
      const mobile = document.getElementById("mobile").value.trim();
      const branch = document.getElementById("branch").value.trim();
      const amount = document.getElementById("amount").value.trim();
      const transferDate = document.getElementById("transferDate").value;
      const bankName = document.getElementById("bankName").value.trim();
      const file = document.getElementById("receipt").files[0];

      let receiptBase64="", receiptMime="", receiptName="";
      if(file){
        receiptBase64 = await fileToBase64(file);
        receiptMime = file.type || "application/octet-stream";
        receiptName = file.name || "receipt";
      }

      const payload = {
        fullName, mobile, branch,
        amount, transferDate, bankName,
        receiptBase64, receiptMime, receiptName
      };

      const res = await fetch(API_URL, {
        method:"POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      if(data.ok){
        show("ok", `تم الإرسال ✅ رقم العملية: ${data.donationId}`);
      }else{
        show("err", data.message || "حدث خطأ");
      }
    }catch(e){
      show("err", String(e));
    }finally{
      btn.disabled = false;
      btn.textContent = "إرسال";
    }
  }
</script>
</body>
</html>
